name: macOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Show Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: Validate example scripts
        run: |
          bash -n examples/*.sh
      - name: Verify timezone scheduling with Foundation
        run: |
          swiftc Runly/Utilities/ScheduleCalculator.swift tests/ScheduleTimeZoneSmoke.swift -o "$RUNNER_TEMP/runly-timezone-smoke"
          "$RUNNER_TEMP/runly-timezone-smoke"
      - name: Build Runly without signing
        run: |
          xcodebuild \
            -project Runly.xcodeproj \
            -scheme Runly \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RunlyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload unsigned testing build
        uses: actions/upload-artifact@v4
        with:
          name: Runly-macOS-unsigned-test-build
          path: ${{ runner.temp }}/RunlyDerivedData/Build/Products/Debug/Runly.app
          if-no-files-found: error
          retention-days: 7
