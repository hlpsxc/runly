name: Build Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release-candidate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned Release candidate
        run: |
          xcodebuild \
            -project Runly.xcodeproj \
            -scheme Runly \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/RunlyDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package and checksum
        run: |
          APP="$RUNNER_TEMP/RunlyDerivedData/Build/Products/Release/Runly.app"
          test -d "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Runly-macOS-unsigned.zip
          shasum -a 256 dist/Runly-macOS-unsigned.zip > dist/SHA256SUMS
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v4
        with:
          name: Runly-macOS-unsigned-release-candidate
          path: dist/
          if-no-files-found: error

# This deliberately does not publish a public Release:
# production distribution requires Developer ID signing and Apple notarization.
